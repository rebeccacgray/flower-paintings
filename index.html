<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower Paintings &amp; Portraits</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --paper:#f4f2ec; --surface:#fcfbf8; --ink:#222222; --muted:#7a7266;
    --line:#ddd7cc; --accent:#31504a; --mat:#efece4; --maxw:1180px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:15px; line-height:1.5;}
  a{color:inherit;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}

  header.masthead{padding:40px 0 18px;}
  .masthead a{display:inline-block; text-decoration:none;}
  .masthead h1{font-family:"Spectral", Georgia, serif; font-style:italic; font-weight:500;
    font-size:clamp(32px, 4.3vw, 46px); letter-spacing:.2px; margin:0; line-height:1.1;}
  .masthead .byline{font-family:"Spectral", Georgia, serif; font-style:normal; font-weight:400;
    font-size:clamp(17px, 2.2vw, 22px); color:var(--muted); margin:8px 0 0; line-height:1.2;}
  .masthead .rule{height:1px; background:var(--line); margin:18px 0 0;}
  .show{margin-top:18px; font-family:"Spectral", Georgia, serif; font-weight:400;
    font-size:15px; line-height:1.55; color:var(--ink);}
  .show p{margin:0;}
  .mast-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px 24px; flex-wrap:wrap;}
  .mast-title{text-decoration:none;}
  .topnav{display:flex; gap:20px; padding-top:10px; white-space:nowrap;
    font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:14px;}
  .topnav a{display:inline-block; color:var(--accent); text-decoration:none;}
  .topnav a:hover{text-decoration:underline;}

  /* page nav on artwork view, all nested left */
  .nav{display:flex; gap:20px; align-items:center; padding:18px 0 4px; font-size:13.5px;}
  .nav a{color:var(--accent); text-decoration:none;}
  .nav a:hover{text-decoration:underline;}

  /* home grid */
  .count{color:var(--muted); font-size:13px; padding:18px 0 0;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:26px 22px; padding:10px 0 32px; align-items:start;}
  .card{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line);
    border-radius:2px; overflow:hidden;}
  .imglink{display:block; text-decoration:none; color:inherit;}
  .frame{background:var(--mat); padding:16px; display:flex; align-items:center; justify-content:center; min-height:170px;}
  .frame img{max-width:100%; height:auto; display:block;}
  .frame .missing{color:var(--muted); font-size:12.5px; text-align:center; padding:24px 8px;}
  .cbody{padding:14.4px 14px 16px; text-align:center;}
  .ctitle{font-family:"Spectral", Georgia, serif; font-size:16px; font-weight:500; line-height:1.2; margin:0;}
  .more{display:inline-block; margin-top:7px; font-size:13px; color:var(--accent);
    text-decoration:underline; text-underline-offset:2px;}
  .more:hover{opacity:.75;}
  .cmeta{color:var(--muted); font-size:12.5px; margin:7px 0 0;}
  .gallery-card .g-name{font-family:"Spectral", Georgia, serif; font-weight:500; font-size:16px; line-height:1.2; margin:0 0 8px;}
  .gallery-card .g-line{margin:0 0 3px; font-size:13px; line-height:1.45;}
  .gallery-card .g-event{margin:0 0 3px; font-size:13px; line-height:1.45;}
  .gallery-card .g-event-first{margin-top:8px;}

  /* artwork view */
  .art{display:grid; grid-template-columns:2fr 1fr; gap:34px; padding:22px 0 32px; align-items:start;}
  .art .imgframe{background:var(--mat); border:1px solid var(--line); border-radius:2px;
    padding:28px; display:flex; align-items:center; justify-content:center;}
  .art .imgframe img{max-width:100%; height:auto; display:block;}
  .art .imgframe .missing{color:var(--muted); font-size:13px; text-align:center; padding:60px 10px;}
  .block{background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:20px; margin-bottom:22px;}
  .block h1{font-family:"Spectral", Georgia, serif; font-weight:500; font-size:24px; line-height:1.18; margin:0 0 14px;}
  .block h2{font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:600; font-size:12px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin:0 0 14px;}
  dl.meta{margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 14px;}
  dl.meta dt{color:var(--muted); font-size:12.5px;}
  dl.meta dd{margin:0; font-size:14px;}

  /* call to action */
  .cta{display:inline-block; margin-top:18px; padding:11px 22px; border-radius:2px;
    font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:14px; font-weight:600;
    text-decoration:none; text-align:center;}
  .cta.buy{background:var(--accent); color:#fcfbf8; border:1px solid var(--accent);}
  .cta.buy:hover{opacity:.9;}
  .cta.inquire{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .cta.inquire:hover{background:var(--accent); color:#fcfbf8;}
  .sold-label{display:inline-block; margin-top:18px; font-size:14px; color:var(--muted); font-style:italic;}

  .related-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
  .related-grid a{text-decoration:none; display:block;}
  .related-grid .rframe{background:var(--mat); border:1px solid var(--line); border-radius:2px;
    padding:10px; display:flex; align-items:center; justify-content:center; min-height:96px;}
  .related-grid img{max-width:100%; height:auto; display:block;}
  .related-grid .rtitle{font-size:12.5px; line-height:1.3; margin:6px 0 0;}

  /* artist statement */
  .statement{max-width:660px; padding:26px 0 32px;}
  .statement .eyebrow{font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:12px;
    letter-spacing:.04em; color:var(--muted); margin:0 0 10px;}
  .statement h1{font-family:"Spectral", Georgia, serif; font-weight:500; font-style:italic;
    font-size:30px; line-height:1.2; margin:0 0 22px;}
  .statement p{font-family:"Spectral", Georgia, serif; font-size:17px; line-height:1.72; margin:0 0 18px;}
  .statement .lead-img{float:right; width:240px; max-width:42%; height:auto;
    margin:6px 0 14px 24px; border:1px solid var(--line); background:var(--mat);}
  .statement-tiles{clear:both; display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:20px; margin-top:40px; padding-top:30px; border-top:1px solid var(--line);}
  .site-footer{border-top:1px solid var(--line); padding:22px 0 44px; text-align:center;
    color:var(--muted); font-size:12.5px; font-family:"IBM Plex Sans", system-ui, sans-serif;}
  @media (max-width:560px){
    .statement .lead-img{float:none; display:block; width:100%; max-width:300px; margin:0 auto 20px;}
  }

  @media (max-width:820px){
    .art{grid-template-columns:1fr; gap:22px;}
  }
  @media (max-width:560px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:18px 14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="mast-top">
      <a class="mast-title" href="#">
        <h1>Flower Paintings &amp; Portraits</h1>
        <p class="byline">Original Artworks by Rebecca C Gray</p>
      </a>
      <nav class="topnav">
        <a href="#statement">Artist Statement</a>
        <a id="contactLink" href="#">Contact</a>
      </nav>
    </div>
    <div class="show">
      <p><span class="venue">Victorian House Gallery</span>, 577 S. Main St, Bourbonnais, IL</p>
      <p><span class="lbl">On View:</span> Nov 2, 2026 &ndash; Feb 6, 2027</p>
    </div>
    <div class="rule"></div>
  </header>
  <main id="view"></main>
  <footer class="site-footer">&copy; Rebecca C Gray 2017&ndash;2027</footer>
</div>

<script>
/* ---------------- config ---------------- */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThQlNRe9c4thGPaDNLfMywOGAmZIPTYyDZQTmXvlWCFf_qzTia44vK5gmGbE9kyN0Dc0NstkuEpYMh/pub?gid=637529450&single=true&output=csv";
const IMAGE_BASE = "https://cdn.jsdelivr.net/gh/rebeccacgray/art-catalog-images@main/";

// SET THIS to your email address. It is used for the Purchase this Work button.
const INQUIRE_EMAIL = "youremail@example.com";

// Columns read by position. paylink (L) drives the Buy / Sold / Purchase button.
const COL = { id:0, category:2, rel1:3, rel2:4, title:6, medium:7, size:8, year:9, price:10, paylink:11 };
const img = (id) => IMAGE_BASE + "images_th/" + id + "_th.jpg";

/* ---------------- helpers ---------------- */
const $ = (id) => document.getElementById(id);
const cell = (r, i) => (r && r[i] != null ? String(r[i]).trim() : "");
function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
function imgInto(frame, src, alt, missingText){
  const im = el("img"); im.loading = "lazy"; im.src = src; im.alt = alt || "";
  im.onerror = () => { frame.innerHTML = ""; const d = el("div", "missing"); d.textContent = missingText; frame.appendChild(d); };
  frame.appendChild(im);
}

let WORKS = [], BY_ID = {};

/* ---------------- contact link ---------------- */
{
  const c = document.getElementById("contactLink");
  if(c){ c.href = "mailto:" + INQUIRE_EMAIL + "?subject=" + encodeURIComponent("Contact: Flower Paintings & Portraits"); }
}

/* ---------------- data ---------------- */
Papa.parse(SHEET_CSV_URL, {
  download:true, header:false, skipEmptyLines:true,
  complete:(res) => {
    let rows = res.data || [];
    if(rows.length && cell(rows[0], COL.id).toLowerCase() === "id") rows = rows.slice(1);
    WORKS = rows.filter(r => cell(r, COL.id) && cell(r, COL.title));
    BY_ID = {};
    WORKS.forEach((r, i) => { BY_ID[cell(r, COL.id)] = i; });
    route();
  },
  error:() => { $("view").innerHTML = '<p class="count">Couldn\u2019t load the catalogue. If you opened this file from your computer, open the web address instead.</p>'; }
});

/* ---------------- routing ---------------- */
window.addEventListener("hashchange", route);
function route(){
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(id === "statement") renderStatement();
  else if(id && BY_ID[id] !== undefined) renderArtwork(id);
  else renderHome();
  window.scrollTo(0, 0);
}

/* ---------------- home ---------------- */
function galleryTile(){
  const card = el("div", "card gallery-card");
  const frame = el("div", "frame");
  imgInto(frame, IMAGE_BASE + "images_th/vhg.jpg", "Victorian House Gallery", "Image not found");
  card.appendChild(frame);
  const body = el("div", "cbody");
  const name = el("p", "g-name"); name.textContent = "Victorian House Gallery"; body.appendChild(name);
  ["577 S. Main St, Bourbonnais, IL",
   "Mon\u2013Thurs 4:30\u20137:30 pm",
   "Fri\u2013Sat 1:00\u20134:00 pm"].forEach(t => { const p = el("p", "g-line"); p.textContent = t; body.appendChild(p); });
  [["On View", "Nov 2, 2026 \u2013 Feb 6, 2027"], ["Live Painting Demo", "Dec 3, 2026, 3:30 pm"], ["Artist Talk", "Feb 6, 2027, 1 pm"]].forEach((e, i) => {
    const p = el("p", "g-event" + (i === 0 ? " g-event-first" : "")); p.textContent = e[0] + ": " + e[1]; body.appendChild(p);
  });
  card.appendChild(body);
  return card;
}

function renderHome(){
  const view = $("view"); view.innerHTML = "";
  const grid = el("div", "grid");
  grid.appendChild(galleryTile());
  WORKS.forEach(r => {
    const id = cell(r, COL.id);
    const href = "#" + encodeURIComponent(id);
    const card = el("div", "card");

    const link = el("a", "imglink"); link.href = href;
    const frame = el("div", "frame");
    imgInto(frame, img(id), cell(r, COL.title), "Image coming soon");
    link.appendChild(frame);

    const body = el("div", "cbody");
    const t = el("p", "ctitle"); t.textContent = cell(r, COL.title); body.appendChild(t);
    const more = el("a", "more"); more.href = href; more.textContent = "More Information"; body.appendChild(more);
    const m = cell(r, COL.category);
    if(m){ const cm = el("p", "cmeta"); cm.textContent = m; body.appendChild(cm); }

    card.appendChild(link); card.appendChild(body); grid.appendChild(card);
  });
  view.appendChild(grid);
}

/* ---------------- artist statement ---------------- */
const STATEMENT = [
  "Flower Paintings and Portraits is a celebration of personality: both in nature and in the people whom I have had the joy to observe from my easel. This exhibition is also a record of the personal introspection I experience while drawing and painting.",
  "In my work, I investigate nature seeking magnificent moments in the world of the mundane. Curiosity and sensitivity are my guides, and they lead me to slow down, look closely, and experience worlds of color and form to be found everywhere. I work from life with the dual goals of refined form and accurate likeness. Each flower, like each person, has a dignity of its own; my role is to let it shine through.",
  "The flowers I choose to paint must have a personality and character. I source my flowers locally, and have a small garden of old world roses that have been kind enough to hold still for me as well as some peonies, poppies, clematis, salvia and narcissus.",
  "In portraits, I seek beautiful contradictions: strong, yet subtle; individual and unique, yet united in our humanity. I thrive on finding just the right contour, just the right light and shadow to tell the stories written on every face.",
  "The works included in this exhibition are in various levels of completion, including sketches for larger works in progress. Some of the small oil portrait studies will be developed into life-size works, while some sketches are an end in themselves, a record of deep observation. In this way, I counterpose refined form and likeness against the openness and vulnerability of process. Exposed ground, pentimenti and translucent layers all express the wonder and joy of discovery I experience with each new subject, each new sketch, and each new canvas.",
  "I was raised in Michigan and I have lived in the Pacific Northwest and New York City. Everywhere I have lived has amplified and enriched my belief that as human beings, we are all one family. Our attraction to beauty in nature and individuality in one another bind us together. While the faces and features of my subjects are diverse, in a deeper sense they are all part of the grand story of nature. These works are a few pages in that great book."
];

const STATEMENT_LEAD_ID = "ROSES008v04";                 // "Pink Roses"
const STATEMENT_TILE_IDS = ["NARCI001v03", "JUNIP002v04", "ROSES007v04"];

function renderStatement(){
  const view = $("view"); view.innerHTML = "";
  const nav = el("nav", "nav");
  const back = el("a"); back.href = "#"; back.textContent = "\u2190 Back to the works";
  nav.appendChild(back); view.appendChild(nav);

  const wrap = el("div", "statement");
  const eye = el("p", "eyebrow"); eye.textContent = "Artist Statement"; wrap.appendChild(eye);
  const h = el("h1"); h.textContent = "Flower Paintings and Portraits"; wrap.appendChild(h);

  const lead = el("img", "lead-img");
  lead.src = IMAGE_BASE + "images_th/" + STATEMENT_LEAD_ID + "_th.jpg";
  lead.alt = "Pink Roses"; lead.loading = "lazy";
  wrap.appendChild(lead);

  STATEMENT.forEach(t => { const p = el("p"); p.textContent = t; wrap.appendChild(p); });

  const tiles = el("div", "statement-tiles");
  STATEMENT_TILE_IDS.forEach(id => {
    const i = BY_ID[id]; if(i === undefined) return;
    const r = WORKS[i];
    const href = "#" + encodeURIComponent(id);
    const card = el("div", "card");
    const link = el("a", "imglink"); link.href = href;
    const frame = el("div", "frame");
    imgInto(frame, img(id), cell(r, COL.title), "Image coming soon");
    link.appendChild(frame);
    const body = el("div", "cbody");
    const t = el("p", "ctitle"); t.textContent = cell(r, COL.title); body.appendChild(t);
    const more = el("a", "more"); more.href = href; more.textContent = "More Information"; body.appendChild(more);
    card.appendChild(link); card.appendChild(body);
    tiles.appendChild(card);
  });
  wrap.appendChild(tiles);

  view.appendChild(wrap);
}

/* ---------------- call to action ---------------- */
function addCTA(container, row){
  const id = cell(row, COL.id);
  const pay = cell(row, COL.paylink);
  if(/^https?:\/\//i.test(pay)){
    const a = el("a", "cta buy"); a.href = pay; a.textContent = "Buy this piece";
    container.appendChild(a);
  } else if(pay.toUpperCase() === "SOLD"){
    const s = el("div", "sold-label"); s.textContent = "Sold";
    container.appendChild(s);
  } else {
    const subject = "Inquiry: " + cell(row, COL.title) + " (" + id + ")";
    const lines = ['I am interested in "' + cell(row, COL.title) + '" (' + id + ').'];
    if(cell(row, COL.medium)) lines.push("Medium: " + cell(row, COL.medium));
    if(cell(row, COL.size))   lines.push("Size: " + cell(row, COL.size));
    if(cell(row, COL.price))  lines.push("Price: " + cell(row, COL.price));
    lines.push("");
    lines.push("Please let me know about availability and shipping.");
    const href = "mailto:" + INQUIRE_EMAIL + "?subject=" + encodeURIComponent(subject) +
                 "&body=" + encodeURIComponent(lines.join("\n"));
    const a = el("a", "cta inquire"); a.href = href; a.textContent = "Purchase this Work";
    container.appendChild(a);
  }
}

/* ---------------- artwork ---------------- */
function renderArtwork(id){
  const view = $("view"); view.innerHTML = "";
  const idx = BY_ID[id], row = WORKS[idx];
  const prev = WORKS[(idx - 1 + WORKS.length) % WORKS.length];
  const next = WORKS[(idx + 1) % WORKS.length];

  // nav: Previous, Home, Next, all nested to the left
  const nav = el("nav", "nav");
  const aPrev = el("a"); aPrev.href = "#" + encodeURIComponent(cell(prev, COL.id)); aPrev.textContent = "\u2190 Previous Artwork";
  const aHome = el("a"); aHome.href = "#"; aHome.textContent = "Home";
  const aNext = el("a"); aNext.href = "#" + encodeURIComponent(cell(next, COL.id)); aNext.textContent = "Next Artwork \u2192";
  nav.appendChild(aPrev); nav.appendChild(aHome); nav.appendChild(aNext);
  view.appendChild(nav);

  const art = el("div", "art");

  // left: image, 2/3
  const left = el("div", "image-col");
  const iframe = el("div", "imgframe");
  imgInto(iframe, img(id), cell(row, COL.title), "Image coming soon");
  left.appendChild(iframe);
  art.appendChild(left);

  // right: blocks, 1/3
  const right = el("div", "detail-col");

  // details block (title, medium, size, year, price, then the button)
  const details = el("div", "block");
  const h1 = el("h1"); h1.textContent = cell(row, COL.title); details.appendChild(h1);
  const dl = el("dl", "meta");
  [["Medium", COL.medium], ["Size", COL.size], ["Year finished", COL.year], ["Price", COL.price]].forEach(([label, c]) => {
    const v = cell(row, c); if(!v) return;
    const dt = el("dt"); dt.textContent = label; const dd = el("dd"); dd.textContent = v;
    dl.appendChild(dt); dl.appendChild(dd);
  });
  details.appendChild(dl);
  addCTA(details, row);
  right.appendChild(details);

  // related block
  const rels = [cell(row, COL.rel1), cell(row, COL.rel2)].filter(x => x && BY_ID[x] !== undefined);
  if(rels.length){
    const rb = el("div", "block");
    const h2 = el("h2"); h2.textContent = "Related Artworks"; rb.appendChild(h2);
    const rg = el("div", "related-grid");
    rels.forEach(rid => {
      const rr = WORKS[BY_ID[rid]];
      const a = el("a"); a.href = "#" + encodeURIComponent(rid);
      const rf = el("div", "rframe");
      imgInto(rf, img(rid), cell(rr, COL.title), "Image coming soon");
      const rt = el("p", "rtitle"); rt.textContent = cell(rr, COL.title);
      a.appendChild(rf); a.appendChild(rt); rg.appendChild(a);
    });
    rb.appendChild(rg);
    right.appendChild(rb);
  }

  art.appendChild(right);
  view.appendChild(art);
}
</script>
</body>
</html>
